<!doctype html><html><head><meta charset="utf-8"><title>Read-only Takeoff Snapshot Inspection</title></head><body><h1>Inspecting saved Takeoff snapshots</h1><p id="status">Starting read-only inspection…</p><script type="module">
const endpoint=new URL(location.href).searchParams.get('bridge');
const status=document.querySelector('#status');
function run(data){return new Promise((resolve,reject)=>{const w=new Worker('/takeoff-snapshot-inspection-worker.js');w.onmessage=({data})=>{w.terminate();data.error?reject(new Error(data.error)):resolve(data);};w.onerror=e=>{w.terminate();reject(new Error(e.message));};w.postMessage(data);});}
try{
 let {keys}=await run({action:'keys'});
 if(new URL(location.href).searchParams.has('newOnly')) keys=keys.filter(key=>key==='job:03-09/123'||key.includes(':snapshot:revision-')||key.endsWith(':snapshot:recovery-original'));
 if(new URL(location.href).searchParams.has('keysOnly')) await fetch(endpoint+'/row',{method:'POST',body:JSON.stringify({keys})});
 else for(let i=0;i<keys.length;i++){
  status.textContent=`Inspecting ${i+1} of ${keys.length}: ${keys[i]}`;
  const row=await run({action:'inspect',key:keys[i]});
  const response=await fetch(endpoint+'/row',{method:'POST',body:JSON.stringify(row)});if(!response.ok)throw new Error('Could not save inspection result.');
 }
 await fetch(endpoint+'/done',{method:'POST'});
 status.textContent=`Read-only inspection complete: ${keys.length} records. Original records are unchanged.`;
}catch(e){status.textContent=e.message;await fetch(endpoint+'/error',{method:'POST',body:e.message});}
</script></body></html>
